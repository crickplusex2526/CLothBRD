<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fashion Store - 60% OFF</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8f2;
  color:#211812;
}

.hero{
  background:linear-gradient(135deg,#ff7a00,#ff9d3d);
  padding:35px 20px 45px;
  text-align:center;
  border-radius:0 0 40px 40px;
}

.hero h1{
  color:#fff;
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
}

.hero p{
  color:white;
  font-size:18px;
  margin-bottom:25px;
}

.features{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-width:700px;
  margin:auto;
}

.feature{
  background:#fff;
  border-radius:40px;
  padding:18px 10px;
  font-size:18px;
  font-weight:700;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:45px 20px;
}

.section-title{
  font-size:38px;
  font-weight:900;
  margin-bottom:5px;
}

.section-sub{
  font-size:20px;
  color:#666;
  margin-bottom:30px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
}

.card{
  background:white;
  border:2px solid #ffd9bd;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.product-img{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block;
  background:#eee;
}

.info{
  padding:20px;
}

.badges{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.sale{
  background:#f23000;
  color:white;
  padding:9px 15px;
  border-radius:14px;
  font-weight:900;
}

.code{
  background:#111;
  color:white;
  padding:9px 15px;
  border-radius:14px;
  font-weight:900;
}

.name{
  font-size:23px;
  font-weight:800;
  margin-bottom:12px;
}

.price{
  color:#ef4500;
  font-size:30px;
  font-weight:900;
}

.old{
  color:#999;
  font-size:19px;
  text-decoration:line-through;
  margin-left:8px;
}

.details{
  color:#666;
  margin:12px 0 18px;
  font-size:16px;
}

.order{
  width:100%;
  border:0;
  background:#000;
  color:#fff;
  padding:17px;
  border-radius:18px;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
}

.order:hover{
  background:#222;
}

#orderBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1000;
  padding:20px;
  overflow:auto;
}

.form{
  max-width:500px;
  margin:30px auto;
  background:white;
  border-radius:25px;
  padding:25px;
}

.form h2{
  margin-bottom:20px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

.payment{
  display:flex;
  gap:10px;
  margin:10px 0;
}

.payment label{
  flex:1;
  padding:14px;
  background:#f5f5f5;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.submit{
  width:100%;
  background:#000;
  color:#fff;
  border:0;
  padding:16px;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
}

.close{
  float:right;
  background:#eee;
  border:0;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
}

@media(max-width:600px){
  .hero h1{
    font-size:32px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-img{
    height:220px;
  }

  .name{
    font-size:17px;
  }

  .price{
    font-size:22px;
  }

  .old{
    font-size:14px;
  }

  .info{
    padding:12px;
  }

  .sale,.code{
    padding:7px 9px;
    font-size:12px;
  }

  .order{
    font-size:15px;
    padding:13px;
  }
}
</style>
</head>

<body>

<section class="hero">
  <h1>60% OFF CLOTHING</h1>
  <p>Fresh styles • Easy Return • Secure Order</p>

  <div class="features">
    <div class="feature">💵 COD Available</div>
    <div class="feature">💳 UPI Prepaid</div>
    <div class="feature">🚚 3–4 Days Delivery</div>
    <div class="feature">↩️ Easy Return</div>
  </div>
</section>

<div class="container">

<h2 class="section-title">👟 Shoes</h2>
<p class="section-sub">Product codes 001–008</p>

<div class="products" id="shoes"></div>

<h2 class="section-title" style="margin-top:55px">👕 Clothing</h2>
<p class="section-sub">Product codes 011–016</p>

<div class="products" id="clothes"></div>

</div>

<div id="orderBox">

<div class="form">

<button class="close" onclick="closeOrder()">×</button>

<h2>Complete Your Order</h2>

<div id="selectedProduct"></div>

<input id="name" placeholder="Full Name">

<textarea id="address" placeholder="Full Address"></textarea>

<input id="city" placeholder="City">

<input id="pincode" placeholder="Pincode">

<input id="size" placeholder="Size">

<select id="payment">
<option value="COD">COD - Cash on Delivery</option>
<option value="PREPAID">Prepaid - UPI</option>
</select>

<input id="utr" placeholder="UTR / Transaction ID (Prepaid only)">

<button class="submit" onclick="placeOrder()">
Place Order
</button>

</div>
</div>

<script>

const shoes = [

["001","Premium Running Shoes","₹1,120","₹2,800","IMG_6745.png"],

["002","Air Cushion Sports Shoes","₹880","₹2,200","IMG_6744.png"],

["003","Performance Sports Shoes","₹1,200","₹3,000","IMG_6746.png"],

["004","Classic Running Shoes","₹800","₹2,000","IMG_6742.png"],

["005","Street Style Shoes","₹960","₹2,400","IMG_6747.png"],

["006","Premium Casual Shoes","₹1,200","₹3,000","IMG_6716.png"],

["007","Urban Fashion Shoes","₹1,360","₹3,400","IMG_6734.png"],

["008","Daily Comfort Shoes","₹920","₹2,300","IMG_6739.png"]

];

const clothes = [

["011","Premium Casual Set","₹1,120","₹2,800","cloth1.png"],

["012","Orange Sports Set","₹880","₹2,200","cloth2.png"],

["013","Black Streetwear Set","₹1,200","₹3,000","cloth3.png"],

["014","Classic Black Set","₹800","₹2,000","cloth4.png"],

["015","Vintage Casual Set","₹960","₹2,400","cloth5.png"],

["016","Denim Fashion Set","₹1,200","₹3,000","cloth6.png"]

];

function createProducts(list,target){

  document.getElementById(target).innerHTML = list.map(p => `

    <div class="card">

      <div style="position:relative">

        <img
          class="product-img"
          src="${p[4]}"
          alt="${p[1]}"
          onerror="this.style.display='none'"
        >

      </div>

      <div class="info">

        <div class="badges">

          <span class="sale">SALE</span>

          <span class="code">CODE ${p[0]}</span>

        </div>

        <div class="name">${p[1]}</div>

        <div>

          <span class="price">${p[2]}</span>

          <span class="old">${p[3]}</span>

        </div>

        <div class="details">
          COD Available • Easy Return
        </div>

        <button class="order"
          onclick='openOrder(${JSON.stringify(p)})'>
          Order Now
        </button>

      </div>

    </div>

  `).join('');

}

createProducts(shoes,"shoes");
createProducts(clothes,"clothes");

let selected = null;

function openOrder(product){

  selected = product;

  document.getElementById("selectedProduct").innerHTML =
  `<b>Product:</b> ${product[1]}<br>
   <b>Code:</b> ${product[0]}<br>
   <b>Price:</b> ${product[2]}`;

  document.getElementById("orderBox").style.display="block";

}

function closeOrder(){

  document.getElementById("orderBox").style.display="none";

}

function placeOrder(){

  if(!selected) return;

  const name =
  document.getElementById("name").value.trim();

  const address =
  document.getElementById("address").value.trim();

  const city =
  document.getElementById("city").value.trim();

  const pincode =
  document.getElementById("pincode").value.trim();

  const size =
  document.getElementById("size").value.trim();

  const payment =
  document.getElementById("payment").value;

  const utr =
  document.getElementById("utr").value.trim();

  if(!name || !address || !city || !pincode || !size){

    alert("Please fill all details.");

    return;

  }

  if(payment==="PREPAID" && !utr){

    alert("Please enter UTR / Transaction ID.");

    return;

  }

  let message =

`🛍️ NEW ORDER

Product: ${selected[1]}
Product Code: ${selected[0]}
Price: ${selected[2]}

Customer Name: ${name}

Address: ${address}

City: ${city}

Pincode: ${pincode}

Size: ${size}

Payment: ${payment}

UTR: ${utr || "N/A"}

Delivery: 3-4 Days

Return: Available`;

  const whatsapp =
  "https://wa.me/918320651288?text=" +
  encodeURIComponent(message);

  window.open(whatsapp,"_blank");

}

</script>

</body>
</html>
